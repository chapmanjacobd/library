[project]
authors = [
  {name = "Jacob Chapman", email = "7908073+chapmanjacobd@users.noreply.github.com"},
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Multimedia",
  "Topic :: Utilities",
]
dependencies = [
  "beautifulsoup4>=4.10.0", # https://git.launchpad.net/beautifulsoup/commit/?id=34e0ce8a9dd43ada1c55b50a156fbce63b1e2ebb
  "certifi>=2026.10.19",
  "sqlite-utils>=3.38",
  "ipython>=9.0.0",
  "ffmpeg-python",
  "yt-dlp[default]",
  "natsort",
  "charset-normalizer",
  "puremagic",
  "ftfy",
  "wcwidth",
  "humanize",
  "lxml",
  "markdown-it-py",
  "mutagen",
  "praw",
  "pip>=26.2.2",
  "pysubs2",
  "python-dateutil",
  "python-mpv-jsonipc",
  "regex",
  "requests",
  "rich",
  "screeninfo",
  "tabulate",
  "tinytag",
  "tldextract",
  'pyreadline3; platform_system == "Windows"',
]
description = "xk media library"
keywords = ["media", "library", "archive", "database", "ffmpeg", "yt-dlp", "mpv", "filesystem", "torrent"]
version = "4.0.5"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
name = "library"
readme = ".github/README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["black", "isort", "ssort"]
test = ["ruff", "pytest", "pytest-regressions", "freezegun", "pandas", "pyfakefs"]
deluxe = [
  "aiohttp",
  "annoy",
  "catt",
  "cdx_toolkit",
  "curl-cffi",
  "gallery-dl",
  "geopandas",
  "img2pdf",
  "internetarchive",
  "numpy",
  "ocrmypdf",
  "openpyxl",
  "paramiko",
  "pdf2image",
  "pillow",
  "PyExifTool",
  "pymcdm",
  "pyvirtualdisplay",
  "qbittorrent-api",
  "scikit-learn",
  "selenium",
  'libtorrent; python_version < "3.14"',
  "tqdm",
  "wordllama>=0.2.7.post0",
  "xmltodict",
  'xattr; platform_system != "Windows"',
]
fat = [
  "camelot-py>=0.11.0",
  "ghostscript",
  "opencv-python",
  "orjson",
  "selenium-wire-lw",
  "subliminal",
  "textract-py3==2.0.1",
]

[project.urls]
documentation = "https://github.com/chapmanjacobd/library#usage"
homepage = "https://github.com/chapmanjacobd/library#readme"
repository = "https://github.com/chapmanjacobd/library/"

[project.scripts]
lb = "library.__main__:library"
library = "library.__main__:library"

[build-system]
requires = ["uv_build>=0.12.19,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "library"
source-exclude = ["tests/**"]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]

[tool.isort]
atomic = true
combine_straight_imports = true
float_to_top = true
group_by_package = true
line_length = 120
profile = "black"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["unused-import"]
"tests/*" = ["missing-return-type-undocumented-public-function", "magic-value-comparison"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
unfixable = ["unused-variable"]
ignore = [
  "missing-type-function-argument",
  "missing-type-args",
  "missing-type-kwargs",
  "ANN2",
  "missing-return-type-undocumented-public-function",
  "missing-return-type-special-method",
  "any-type",
  "zip-without-explicit-strict",
  "blind-except",
  "unnecessary-generator-list",
  "unnecessary-generator-set",
  "unnecessary-literal-set",
  "complex-structure",
  "missing-trailing-comma",
  "D1",
  "D2",
  "multiple-imports-on-one-line",
  "line-too-long",
  "not-in-test",
  "ambiguous-variable-name",
  "raw-string-in-exception",
  "commented-out-code",
  "unused-import",
  "boolean-default-value-positional-argument",
  "unsorted-imports",
  "unconventional-import-alias",
  "non-lowercase-variable-in-function",
  "invalid-function-name",
  "blanket-type-ignore",
  "blanket-noqa",
  "import-outside-top-level",
  "too-many-arguments",
  "global-statement",
  "redefined-loop-name",
  "pytest-fixture-incorrect-parentheses-style",
  "pytest-raises-too-broad",
  "start-process-with-partial-path",
  "PTH1",
  "PTH1",
  "PTH2",
  "bad-quotes-inline-string",
  "unnecessary-assign",
  "superfluous-else-return",
  "superfluous-else-raise",
  "superfluous-else-continue",
  "ambiguous-unicode-character-string",
  "unused-noqa",
  "assert",
  "hardcoded-temp-file",
  "suspicious-mktemp-usage",
  "suspicious-non-cryptographic-random-usage",
  "hashlib-insecure-hash-function",
  "subprocess-without-shell-equals-true",
  "start-process-with-no-shell",
  "needless-bool",
  "suppressible-exception",
  "if-else-block-instead-of-if-exp",
  "reimplemented-builtin",
  "if-with-same-arms",
  "in-dict-keys",
  "debugger",
  "print",
  "missing-todo-author",
  "missing-todo-link",
  "missing-todo-colon",
  "raise-vanilla-args",
  "try-consider-else",
  "raise-within-try",
  "redundant-open-modes",
  "datetime-timezone-utc",
  "printf-string-formatting",
  "missing-copyright-notice",
]
select = ["ALL"]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.pytest.ini_options]
addopts = "--pdbcls=IPython.terminal.debugger:TerminalPdb --ignore=tests/data --capture=tee-sys --capture=no --log-cli-level=ERROR"
testpaths = ["tests"]

[tool.pyright]
exclude = [
  "**/__pycache__",
  ".*cache",
  "__pypackages__",
  ".git",
]
reportMissingImports = true
typeCheckingMode = "basic"


[tool.ty.rules]
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
unresolved-attribute = "ignore"
unresolved-import = "ignore"
